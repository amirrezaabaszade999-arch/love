<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>امیر عباس زاده</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
justify-content:center;background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1);
font-family:Tahoma,sans-serif;overflow:hidden;text-align:center;color:#fff;padding:20px}
h1{font-size:2.4rem;text-shadow:0 3px 10px rgba(0,0,0,.3);margin-bottom:30px}
.step{display:none;margin:12px 0;font-size:1.4rem;animation:fade 1s}
.step.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
button{font-size:1.2rem;padding:10px 26px;margin:6px;border:none;border-radius:30px;
background:#fff;color:#e91e63;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#no{position:relative}
.f{position:fixed;top:-60px;animation:fall linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#gift{font-size:5rem;cursor:pointer;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:scale(1.2)}}
</style>
</head>
<body>

<h1>امیر عباس زاده</h1>

<div class="step show" id="s1">
  شما منو دوست دارین؟ 🥺<br>
  <button onclick="yes()">آره ❤️</button>
  <button id="no" onmouseover="run()" ontouchstart="run()">نه</button>
</div>
<div class="step" id="m1">منم شمارو دوست دارم ❤️</div>

<div class="step" id="s2">
  من عاشق فوتبالم یا والیبال؟ 🤔<br>
  <button onclick="ball()">فوتبال ⚽</button>
  <button onclick="wrong()">والیبال 🏐</button>
  <div id="w"></div>
</div>
<div class="step" id="m2">من شمارو دوست دارم 😍</div>

<div class="step" id="s3">
  یه کادو برات دارم، بزن روش 👇<br>
  <div id="gift" onclick="openGift()">🎁</div>
</div>
<div class="step" id="m3">خیلی دوستون دارم 💖</div>

<script>
const $=id=>document.getElementById(id);
const show=id=>$(id).classList.add('show');
function rain(e){
  for(let i=0;i<40;i++){
    const s=document.createElement('span');
    s.className='f';s.textContent=e;
    s.style.left=Math.random()*95+'vw';
    s.style.fontSize=(24+Math.random()*30)+'px';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),7000);
  }
}
function run(){
  const b=$('no');
  b.style.left=(Math.random()*160-80)+'px';
  b.style.top=(Math.random()*100-50)+'px';
}
function yes(){
  $('s1').style.display='none';
  rain('❤️');show('m1');
  setTimeout(()=>show('s2'),2500);
}
function ball(){
  $('s2').style.display='none';
  rain('⚽');show('m2');
  setTimeout(()=>show('s3'),2500);
}
function wrong(){ $('w').textContent='اشتباهه 😜 دوباره حدس بزن'; }
function openGift(){
  $('gift').textContent='🎉';
  $('gift').style.animation='none';
  rain('🎉');show('m3');
}
</script>
</body>
</html>
